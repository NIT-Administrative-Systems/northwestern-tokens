name: Bug Report
description: Report a wrong color, a font that won't load, or a token that doesn't work
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue, including how you import the package.
      placeholder: |
        1. Import `@nu-appdev/northwestern-tokens/tailwind.css`
        2. Use `bg-nu-purple-100`
        3. Observe ...
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: consumer
    attributes:
      label: How do you load the tokens?
      options:
        - Tailwind CSS v4
        - Plain CSS
        - Through northwestern-filament-theme
        - Through northwestern-starlight-theme
    validations:
      required: true

  - type: input
    id: tailwind-version
    attributes:
      label: Tailwind CSS version (if applicable)
      placeholder: "4.1.0"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, a link to the brand palette entry, the browser, or anything else that might help.
    validations:
      required: false
