name: 🔍 CI

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.x.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run unit tests
        run: pnpm test

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Biome
        run: pnpm check

      - name: Run Stylelint
        run: pnpm lint:css

      - name: Check dependencies
        run: pnpm check:deps

  tailwind:
    name: 🌊 Tailwind ${{ matrix.tailwind }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tailwind: ["4.0", "4"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pack the package
        run: pnpm pack --pack-destination /tmp

      - name: Create smoke test project
        run: |
          mkdir -p /tmp/tailwind-test
          cd /tmp/tailwind-test
          echo '{ "type": "module" }' > package.json
          cat > input.css << 'CSS'
          @import "tailwindcss";
          @import "@nu-appdev/northwestern-tokens";
          @import "@nu-appdev/northwestern-tokens/tailwind.css";
          CSS
          cat > index.html << 'HTML'
          <div class="bg-nu-purple-100 text-nu-success/50 font-nu-heading rounded-lg"></div>
          HTML
          pnpm add tailwindcss@${{ matrix.tailwind }} @tailwindcss/cli@${{ matrix.tailwind }} /tmp/nu-appdev-northwestern-tokens-*.tgz

      - name: Verify build
        working-directory: /tmp/tailwind-test
        run: |
          ./node_modules/.bin/tailwindcss -i input.css -o out.css
          node --input-type=module << 'CHECK'
          import { readFile } from "node:fs/promises";

          const css = await readFile("out.css", "utf8");
          const expectedFragments = [
              "--nu-purple-100: #4e2a84",
              ".bg-nu-purple-100",
              ".text-nu-success\\/50",
              "font-family: var(--font-nu-heading)",
              "--radius-lg: var(--nu-border-radius)",
              "https://common.northwestern.edu/dept/4.0/css/fonts/",
          ];

          for (const fragment of expectedFragments) {
              if (!css.includes(fragment)) {
                  throw new Error(`Expected compiled CSS to contain ${fragment}`);
              }
          }
          CHECK
